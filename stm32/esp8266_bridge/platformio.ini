; ESP8266 串口 WiFi 透传桥
; 编哪个用 -e 指定 (build.bat / flash.bat 默认 nodemcu)
;
;   nodemcu     : NodeMCU / 物联网开发板 (ESP-12E, CH340, Type-C) —— 插 USB 直接烧
;   nodemcu_ttl : 同上, 但板载 USB/CH340 不通时, 用外部 USB-TTL 接 GPIO1/GPIO3 烧
;                 (烧录前手动进下载模式: 按住 FLASH -> 点一下 RST -> 松开 FLASH)
;   esp01       : ESP-01 / ESP-01S (1MB) —— 需要 3.3V TTL + GPIO0 拉低

[env:nodemcu]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; 若板子是 1MB Flash 的缩水版, 换成下面两行:
; board = esp12e
; board_build.flash_size = 1MB

[env:nodemcu_ttl]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; 没有 DTR/RTS 复位线, 所以不让 esptool 自己去复位芯片
upload_flags =
    --before=no_reset
    --after=no_reset

[env:esp01]
platform = espressif8266
board = esp01_1m
framework = arduino
upload_speed = 115200
monitor_speed = 115200
upload_flags =
    --before=no_reset
    --after=no_reset