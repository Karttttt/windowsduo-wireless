; PlatformIO project — STM32F103C8T6 (Blue Pill) + MPU6050
; 编译: pio run
; 烧录: pio run -t upload   (ST-Link V2, SWD)
; 串口: pio device monitor  (CH340, 115200)
;
; 本机注意:
;   1) 工具链要求 TMP/TEMP 指向工作区内目录 (指向 C:\Temp 会 Permission denied),
;      且用户名含中文时 gcc 容易崩, 所以统一走 build.bat / flash.bat,
;      它们会用 ASCII 目录联接 C:\duo 并设置 TMP。
;   2) 串口 ISP (BOOT0=1) 不走 PlatformIO, 用 stm32flash 手动执行, 见 README。

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -Wall